<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hào Khí Đại Việt</title>
<meta name="description" content="Game luyện phép chia có dư lớp 3 theo cốt truyện chống giặc ngoại xâm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --son:#C8102E; --son-d:#8E0B20; --son-l:#E8405C;
  --kim:#F5C84C; --kim-l:#FFE7A8; --kim-d:#C9941B;
  --nen1:#1A0E0B; --nen2:#36170F; --nen3:#4A2217;
  --giay:#FBF1DC; --giay-d:#EBDBBB;
  --muc:#2B1B14;
  --xanh:#2E7FD4;   /* so bi chia */
  --cam:#E8701A;    /* so chia   */
  --la:#2E9E5B;     /* thuong    */
  --do:#D62828;     /* so du     */
  --ngoc:#2FA18F;
  --tim:#7B4B9E;
  --ok:#2E9E5B; --no:#D14343;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Baloo 2',"Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(1100px 620px at 50% -10%, #5A2A18 0%, transparent 60%),
    linear-gradient(170deg,var(--nen2),var(--nen1) 60%);
  background-attachment:fixed;
  color:var(--giay); min-height:100vh;
  overscroll-behavior:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:0;
  background-image:
    repeating-linear-gradient(45deg,#F5C84C 0 2px,transparent 2px 22px),
    repeating-linear-gradient(-45deg,#F5C84C 0 2px,transparent 2px 22px);
}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none !important}

/* ---------- chung ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;border-radius:999px;font-weight:800;font-size:19px;
  background:linear-gradient(180deg,var(--son-l),var(--son));
  color:#fff;box-shadow:0 5px 0 var(--son-d),0 10px 22px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s; min-height:52px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--son-d)}
.btn.kim{background:linear-gradient(180deg,#FFDE8A,var(--kim));color:#53320A;box-shadow:0 5px 0 var(--kim-d),0 10px 22px rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(245,200,76,.45);color:var(--kim-l);font-size:16px;padding:11px 18px;min-height:44px}
.btn.sm{font-size:15px;padding:10px 16px;min-height:42px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:linear-gradient(180deg,var(--giay),var(--giay-d));color:var(--muc);border-radius:var(--r);
  box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 0 0 3px rgba(201,148,27,.35);padding:16px}

/* ---------- topbar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(26,14,11,.97),rgba(26,14,11,.75) 75%,transparent)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;color:var(--kim-l);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icbtn{width:44px;height:44px;border-radius:14px;background:rgba(245,200,76,.14);
  box-shadow:inset 0 0 0 2px rgba(245,200,76,.4);font-size:20px;display:grid;place-items:center;flex:none}
.hao{display:flex;align-items:center;gap:6px;background:rgba(245,200,76,.16);
  box-shadow:inset 0 0 0 2px rgba(245,200,76,.4);border-radius:999px;padding:7px 14px;font-weight:800;color:var(--kim-l);flex:none}

/* ---------- home ---------- */
.hero{text-align:center;padding:14px 0 6px}
.hero h1{margin:6px 0 2px;font-size:clamp(34px,9vw,60px);line-height:1;color:var(--kim);
  text-shadow:0 3px 0 var(--son-d),0 6px 16px rgba(0,0,0,.6);letter-spacing:.5px}
.hero h2{margin:0 0 12px;font-size:clamp(16px,4.4vw,23px);color:#FFD9A0;font-weight:600}
.drum{width:clamp(130px,34vw,180px);height:clamp(130px,34vw,180px);margin:4px auto 10px;display:block;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.55));animation:spin 44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.homebtns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}
.note{font-size:13px;opacity:.65;text-align:center;margin-top:18px;line-height:1.5;padding:0 6px}

/* ---------- map ---------- */
.maplist{display:flex;flex-direction:column;gap:13px;margin-top:6px}
.ai{display:flex;gap:13px;align-items:center;padding:13px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(251,241,220,.97),rgba(235,219,187,.93));color:var(--muc);
  box-shadow:0 7px 20px rgba(0,0,0,.4), inset 0 0 0 3px rgba(201,148,27,.4);
  text-align:left;width:100%;transition:transform .1s}
.ai:active{transform:scale(.985)}
.ai .num{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;
  font-size:26px;font-weight:800;color:#fff;background:linear-gradient(180deg,var(--son-l),var(--son));
  box-shadow:0 3px 0 var(--son-d)}
.ai .bd{flex:1;min-width:0}
.ai .bd b{display:block;font-size:17px;line-height:1.2}
.ai .bd .su{font-size:13px;color:#7A5A2E;font-weight:600}
.ai .bd .kn{font-size:13.5px;color:#4a3a2a;margin-top:3px}
.ai .st{font-size:15px;letter-spacing:1px;flex:none;color:#C9941B}
.ai.lock{filter:grayscale(.7);opacity:.62}
.sect{font-size:14px;letter-spacing:2px;color:var(--kim);font-weight:800;margin:20px 0 8px;opacity:.9}

/* ---------- scene ---------- */
.scene{position:relative;height:96px;border-radius:16px;overflow:hidden;margin-bottom:10px;
  box-shadow:inset 0 0 0 3px rgba(245,200,76,.3), 0 6px 18px rgba(0,0,0,.35)}
.scene svg{display:block;width:100%;height:100%}

/* ---------- step chips ---------- */
.chips{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;
  background:rgba(255,255,255,.07);color:#C9B48E;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.chip.on{background:linear-gradient(180deg,#FFDE8A,var(--kim));color:#53320A;
  box-shadow:0 3px 0 var(--kim-d);transform:translateY(-1px)}
.chip.done{color:var(--la);box-shadow:inset 0 0 0 2px rgba(46,158,91,.5)}

/* ---------- bang chia ---------- */
.board{display:flex;justify-content:center;padding:14px 6px 6px}
.dt{display:flex;align-items:flex-start;gap:0;font-weight:800;
  font-size:clamp(28px,8.5vw,44px);line-height:1}
.dtL{display:grid;gap:0}
.cell{width:var(--cw);height:var(--ch);display:grid;place-items:center;position:relative}
.cell .v{opacity:0;transform:scale(.3);transition:opacity .22s,transform .22s}
.cell.show .v{opacity:1;transform:scale(1)}
.cell.pop .v{animation:pop .4s}
@keyframes pop{0%{transform:scale(.2) rotate(-18deg)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.cell.hl::before{content:"";position:absolute;inset:2px;border-radius:9px;
  background:rgba(245,200,76,.22);box-shadow:inset 0 0 0 3px var(--kim);animation:bz 1.1s ease-in-out infinite}
@keyframes bz{50%{box-shadow:inset 0 0 0 3px rgba(245,200,76,.35)}}
.cell.tap{cursor:pointer}
.cell.tap::after{content:"";position:absolute;inset:3px;border-radius:9px;box-shadow:inset 0 0 0 3px rgba(47,161,143,.8);animation:bz 1s infinite}
.rule{height:4px;border-radius:4px;background:var(--do);margin-top:-5px;opacity:0;transition:opacity .25s}
.rule.show{opacity:1}
.c-bichia{color:var(--xanh)} .c-tru{color:var(--muc)} .c-du{color:var(--do)}
.c-ha{color:var(--tim)} .c-thuong{color:var(--la)} .c-chia{color:var(--cam)}
.dtR{display:flex;flex-direction:column;border-left:5px solid var(--muc);padding-left:12px;margin-left:4px}
.dtR .rl{height:5px;background:var(--muc);border-radius:4px;margin:2px 0 4px;width:100%}
.dtQ{display:flex;min-height:var(--ch)}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12.5px;font-weight:700;margin-top:4px}
.legend i{font-style:normal;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.07)}

/* ---------- hoi / nhap ---------- */
.ask{text-align:center;font-size:clamp(18px,4.8vw,23px);font-weight:700;margin:12px 4px 10px;line-height:1.45;color:var(--muc)}
.ask b{padding:1px 8px;border-radius:9px;background:rgba(0,0,0,.07)}
.ask .n1{color:var(--xanh)} .ask .n2{color:var(--cam)} .ask .n3{color:var(--la)} .ask .n4{color:var(--do)}

.slots{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin:6px 0 12px;flex-wrap:wrap}
.slot{text-align:center}
.slot .lb{font-size:12.5px;font-weight:800;margin-bottom:4px;opacity:.8}
.slot .bx{min-width:78px;height:62px;border-radius:14px;background:#fff;display:grid;place-items:center;
  font-size:32px;font-weight:800;box-shadow:inset 0 0 0 3px #CDBB96;padding:0 10px}
.slot.on .bx{box-shadow:inset 0 0 0 4px var(--ngoc);background:#F0FFFC}
.slot.ok .bx{box-shadow:inset 0 0 0 4px var(--ok);background:#EFFCF2}
.slot.no .bx{box-shadow:inset 0 0 0 4px var(--no);background:#FFF0F0;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:460px;margin:0 auto}
.key{height:56px;border-radius:14px;font-size:25px;font-weight:800;color:var(--muc);
  background:linear-gradient(180deg,#fff,#E9DFC6);box-shadow:0 4px 0 #BCA87F}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #BCA87F}
.key.fn{font-size:17px;background:linear-gradient(180deg,#FFDE8A,var(--kim));box-shadow:0 4px 0 var(--kim-d)}
.key.ok{background:linear-gradient(180deg,#7FE0A2,#2E9E5B);color:#fff;box-shadow:0 4px 0 #1C6B3C}

.choices{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.ch{padding:16px;border-radius:16px;font-size:18px;font-weight:800;color:var(--muc);text-align:left;
  background:linear-gradient(180deg,#fff,#EFE5CC);box-shadow:0 4px 0 #BCA87F}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #BCA87F}
.ch.ok{background:linear-gradient(180deg,#9DEBBA,#45BD74);box-shadow:0 4px 0 #1C6B3C;color:#0C3A20}
.ch.no{background:linear-gradient(180deg,#FFB4B4,#E56A6A);box-shadow:0 4px 0 #9B2A2A;color:#4A0F0F}

/* ---------- feedback ---------- */
.fb{margin:12px auto 0;max-width:620px;border-radius:16px;padding:13px 16px;font-size:16px;font-weight:700;
  line-height:1.5;display:none;animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fb.on{display:block}
.fb.good{background:linear-gradient(180deg,#9DEBBA,#5FCB8B);color:#0C3A20;box-shadow:0 5px 0 #2E9E5B}
.fb.bad{background:linear-gradient(180deg,#FFD6A5,#FFB46B);color:#5A2B00;box-shadow:0 5px 0 #C97A1B}
.fb.info{background:linear-gradient(180deg,#BFE3FF,#8CC8F5);color:#0A2E4A;box-shadow:0 5px 0 #3C7FB5}
.fb .hd{font-size:18px;font-weight:800;display:block;margin-bottom:3px}

.bar{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.prog{height:12px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 10px;
  box-shadow:inset 0 0 0 2px rgba(245,200,76,.3)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--kim),#FF9A3C);transition:width .4s}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,5,3,.82);z-index:60;display:grid;place-items:center;padding:16px;
  animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mo{max-width:560px;width:100%;max-height:86vh;overflow:auto;background:linear-gradient(180deg,var(--giay),var(--giay-d));
  color:var(--muc);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 0 4px var(--kim-d)}
.mo h3{margin:0 0 10px;color:var(--son);font-size:23px}
.mo h4{margin:16px 0 6px;color:var(--son-d);font-size:17px}
.mo p,.mo li{font-size:15.5px;line-height:1.6;margin:6px 0}
.mo ul{padding-left:20px;margin:6px 0}
.mtab{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin:10px 0}
.mt{padding:10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px #D8C9A4;font-weight:800;font-size:17px;text-align:center}
.mt.on{background:linear-gradient(180deg,#FFE7A8,var(--kim));box-shadow:inset 0 0 0 3px var(--kim-d)}

/* ---------- ket qua ---------- */
.stars{font-size:54px;text-align:center;letter-spacing:8px;margin:6px 0}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:rgba(0,0,0,.06);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:27px;color:var(--son)}
.stat span{font-size:13px;font-weight:700;opacity:.75}

.conf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.cf{position:absolute;width:11px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg);opacity:.1}}

.timer{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px;font-weight:800;color:var(--kim-l)}
.tbar{width:180px;height:12px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(245,200,76,.3)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#6CDF8F,#FFD75E,#FF6B6B);transition:width .25s linear}

@media(max-width:420px){
  .pad{gap:6px} .key{height:52px;font-size:22px}
  .ai .num{width:46px;height:46px;font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="conf" id="conf"></div>

<script>
"use strict";
/* ============================================================
   HÀO KHÍ ĐẠI VIỆT — Phép chia có dư, lớp 3
   Bám sát bài giảng: CHIA – NHÂN – TRỪ – HẠ
   ============================================================ */

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- âm thanh (tự tổng hợp, không cần file) ---------- */
let AC=null;
const S = { on: true };
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } } if(AC&&AC.state==='suspended') AC.resume(); return AC||null; }
function tone(f,d,type,vol,delay){
  if(!S.on) return; const c=ac(); if(!c) return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||.18,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
function noise(d,vol,delay){
  if(!S.on) return; const c=ac(); if(!c) return;
  const t=c.currentTime+(delay||0), n=Math.floor(c.sampleRate*d);
  const b=c.createBuffer(1,n,c.sampleRate), da=b.getChannelData(0);
  for(let i=0;i<n;i++) da[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4);
  const src=c.createBufferSource(); src.buffer=b;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500;
  const g=c.createGain(); g.gain.value=vol||.22;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
}
const SFX = {
  tap(){ tone(520,.06,'triangle',.08); },
  good(){ tone(784,.09,'triangle',.18); tone(1175,.16,'triangle',.15,.08); },
  bad(){ tone(196,.16,'sine',.14); tone(155,.22,'sine',.12,.1); },
  trong(){ tone(92,.34,'sine',.34); noise(.16,.18); },
  chieng(){ tone(440,.9,'triangle',.14); tone(659,.9,'sine',.09,.02); tone(880,1.1,'sine',.06,.04); },
  cam(){ noise(.3,.3); tone(140,.22,'sine',.22); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.2,i*.12)); noise(.4,.12,.5); }
};

/* ---------- lưu tiến độ ---------- */
const KEY='hkdv_v1';
let P = { stars:{}, hao:0, sound:true, doc:false };
try{ const r=localStorage.getItem(KEY); if(r) P=Object.assign(P,JSON.parse(r)); }catch(e){}
S.on = P.sound !== false;
function save(){ try{ P.sound=S.on; localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }

/* ---------- đọc đề (tuỳ máy có giọng tiếng Việt hay không) ---------- */
function noi(text){
  if(!P.doc) return;
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
    u.lang='vi-VN'; u.rate=.92; u.pitch=1.05;
    const vs=speechSynthesis.getVoices()||[];
    const v=vs.find(x=>/vi[-_]?VN/i.test(x.lang))||vs.find(x=>/^vi/i.test(x.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function nin(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }

/* ============================================================
   NỘI DUNG LỊCH SỬ  (kiến thức phổ thông, SGK Lịch sử & Địa lí)
   Mọi CON SỐ trong bài toán đều là số giả định để luyện tập.
   ============================================================ */
const AI = [
 { id:1, ten:'Mê Linh Dấy Binh', su:'Hai Bà Trưng — năm 40',
   blurb:'Năm 40, Hai Bà Trưng phất cờ khởi nghĩa ở Mê Linh, đánh đuổi quân Đông Hán, giành lại quyền tự chủ cho đất nước.',
   mt:'Ước lượng thương — nền tảng của mọi phép chia',
   kn:'Chia có dư trong bảng: 14 : 3 = 4 (dư 2)',
   loai:'uocluong', so:10, glyph:'ten', mau:'#E8701A',
   nv:'Mỗi mũi tên bắn trúng là một đạo quân về đúng huyện. Bắn đủ 10 mũi!' },

 { id:2, ten:'Cọc Ngầm Bạch Đằng', su:'Ngô Quyền — năm 938',
   blurb:'Năm 938, Ngô Quyền cho đóng cọc gỗ bịt sắt xuống lòng sông Bạch Đằng, lợi dụng thuỷ triều lên xuống để đánh tan quân Nam Hán.',
   mt:'Đặt tính 4 bước: CHIA – NHÂN – TRỪ – HẠ',
   kn:'Chữ số đầu ≥ số chia → lấy 1 chữ số (74 : 3)',
   loai:'datinh', so:3, kieu:'A', gian:['full','full','medium'],
   mau:'#2E7FD4', glyph:'coc', mau_demo:[[74,3],[34,3]],
   nv:'Mỗi bước tính đúng là một cây cọc cắm xuống lòng sông. Cắm đủ cọc, thuyền giặc sẽ mắc cạn!' },

 { id:3, ten:'Phòng Tuyến Như Nguyệt', su:'Lý Thường Kiệt — năm 1077',
   blurb:'Năm 1077, Lý Thường Kiệt lập phòng tuyến trên sông Như Nguyệt (sông Cầu) chặn đứng quân Tống. Tương truyền bài thơ “Nam quốc sơn hà” đã vang lên nơi đây.',

// Ải 1: chia có dư trong bảng, thương 1 chữ số
function deUocLuong(){
  const d = ri(2,9);
  const q = ri(2,9);
  const r = Math.random()<0.82 ? ri(1,d-1) : 0;
  return { N:d*q+r, d, q, r };
}
// kiểu A: chữ số đầu >= số chia  -> lấy 1 chữ số, thương 2 chữ số
function deA(){
  for(let t=0;t<400;t++){
    const d=ri(2,9), a=ri(d,9), b=ri(0,9), N=10*a+b;
    if(N>99) continue;
    const r=N%d;
    if(r===0 && Math.random()<0.75) continue;      // ưu tiên phép có dư
    if(Math.floor(N/d)<10) continue;
    return { N, d };
  }
  return { N:74, d:3 };
}
// kiểu B: chữ số đầu < số chia  -> lấy 2 chữ số, thương 1 chữ số
function deB(){
  for(let t=0;t<400;t++){
    const d=ri(3,9), a=ri(1,d-1), b=ri(0,9), N=10*a+b;
    if(N<d) continue;
    const r=N%d;
    if(r===0 && Math.random()<0.75) continue;
    if(Math.floor(N/d)>9) continue;
    return { N, d };
  }
  return { N:53, d:6 };
}
// kiểu C: thương có chữ số 0 ở hàng đơn vị  (51:5=10 dư 1)
function deC(){
  const opt=[];
  for(let d=2; d<=9; d++)
    for(let q1=1; q1<=9; q1++){
      const base = d*q1;                 // chữ số hàng chục của số bị chia
      if(base>9) break;
      for(let r=1; r<d; r++){
        const N = base*10 + r;
        if(N<=99 && Math.floor(N/d)===q1*10 && N%d===r) opt.push({N,d});
      }
    }
  return pick(opt);
}
function deTheoKieu(k){ return k==='A'?deA() : k==='B'?deB() : deC(); }

// Dựng ngược từ (số chia, thương, số dư) để LUÔN hợp lệ:
//  - số bị chia có 2 chữ số (đúng phạm vi bài học)
//  - luôn có dư  (nếu chia hết thì mất hẳn ý nghĩa "còn thừa" / "cần thêm 1")
//  - thương không quá lớn để học sinh lớp 3 còn hình dung được
function deLoiVan(){
  const tpl = pick(LV);
  const b = ri(2,9);
  const r = ri(1, b-1);
  const qmin = Math.max(2, Math.ceil((10 - r) / b));   // bảo đảm số bị chia >= 10
  const qmax = Math.min(20, Math.floor((99 - r) / b)); // bảo đảm số bị chia <= 99
  if(qmax < qmin) return { tpl, a:37, b:5, q:7, r:2 };
  const q = ri(qmin, qmax);
  return { tpl, a: b*q + r, b, q, r };
}

/* ============================================================
   BỘ MÁY ĐẶT TÍNH  (dựng đúng bố cục như trên bảng)
   ============================================================ */
function alignRight(s, nCols, endCol, cls){
  const arr = new Array(nCols).fill(null);
  for(let i=0;i<s.length;i++){
    const col = endCol - (s.length-1-i);
    if(col>=0 && col<nCols) arr[col] = { v:s[i], cls };
  }
  return arr;
}
// các cột mà chuỗi s chiếm khi canh phải tại endCol
function colsOf(s, endCol, nCols){
  const out=[];
  for(let i=0;i<s.length;i++){
    const c = endCol - (s.length-1-i);
    if(c>=0 && c<nCols) out.push(c);
  }
  return out;
}
function buildPlan(N, d){
  const ds = String(N).split('').map(Number);
  const nCols = ds.length;
  const takeTwo = ds[0] < d;
  const rows = [{ cells: ds.map(x=>({v:String(x),cls:'c-bichia'})), rule:null }];
  const quot = [];
  const steps = [];

  steps.push({ kind:'chon', takeTwo, first:ds[0], d, N,
               twoVal:Number(ds.slice(0,2).join('')), focus:{row:0,from:0,to:(ds[0]<d?1:0)} });

  let k        = takeTwo ? 2 : 1;
  let cur      = takeTwo ? Number(ds.slice(0,2).join('')) : ds[0];
  let curRow   = 0;
  let curFrom  = 0;
  let endCol   = k-1;
  let luot     = 1;

  while(true){
    const q = Math.floor(cur/d), p = q*d, r = cur-p;
    const qi = quot.length;
    quot.push({ v:String(q), cls:'c-thuong' });

    steps.push({ kind:'chia', cur, d, q, ans:q, luot,
                 reveal:[{quot:qi}], focus:{row:curRow,from:curFrom,to:endCol} });

    const pCols = colsOf(String(p), endCol, nCols);
    const pRow = rows.length;
    rows.push({ cells: alignRight(String(p), nCols, endCol, 'c-tru'),
                rule:{ from:pCols[0], to:endCol } });
    steps.push({ kind:'nhan', q, d, ans:p, luot,
                 reveal:[{row:pRow, cols:pCols, rule:true}], focus:{row:curRow,from:curFrom,to:endCol} });

    const rCols = colsOf(String(r), endCol, nCols);
    const rRow = rows.length;
    rows.push({ cells: alignRight(String(r), nCols, endCol, 'c-du'), rule:null });
    steps.push({ kind:'tru', cur, p, ans:r, luot,
                 reveal:[{row:rRow, cols:rCols}], focus:{row:pRow,from:curFrom,to:endCol} });

    steps.push({ kind:'kiemtra', r, d, luot });

    if(k >= ds.length){
      steps.push({ kind:'ketluan', N, d, q:Math.floor(N/d), r:N%d });
      steps.push({ kind:'thulai',  N, d, q:Math.floor(N/d), r:N%d });
      break;
    }
    const bd = ds[k];
    rows[rRow].cells[k] = { v:String(bd), cls:'c-ha' };
    steps.push({ kind:'ha', digit:bd, col:k, used:k, ans:bd, luot,
                 reveal:[{row:rRow,col:k}], focus:{row:0,from:k,to:k} });

    cur    = r*10 + bd;
    curRow = rRow;
    curFrom= Math.min(curFrom, 0);
    endCol = k;
    k++; luot++;
  }
  return { N, d, rows, quot, steps, nCols, takeTwo };
}

/* lời giảng đúng văn phong bài học */
function loiGiang(st, plan){
  switch(st.kind){
    case 'chon':
      return st.takeTwo
        ? `So sánh chữ số đầu tiên của số bị chia với số chia: vì <b>${st.first} &lt; ${st.d}</b> nên ta phải lấy <b>2 chữ số</b> để chia.`
        : `So sánh chữ số đầu tiên của số bị chia với số chia: vì <b>${st.first} ${st.first===st.d?'=':'&gt;'} ${st.d}</b> nên ta chỉ cần lấy <b>1 chữ số</b> để chia.`;
    case 'chia':
      return st.q===0
        ? `<b>${st.cur} &lt; ${st.d}</b> nên thương bằng <b>0</b>, viết 0. <i>(Trường hợp đặc biệt, chỉ áp dụng từ lượt chia thứ 2)</i>`
        : `<b>${st.cur}</b> chia <b>${st.d}</b> được <b>${st.q}</b>, viết ${st.q}.`;
    case 'nhan': return `<b>${st.q}</b> nhân <b>${st.d}</b> bằng <b>${st.ans}</b>.`;
    case 'tru':  return `<b>${st.cur}</b> trừ <b>${st.p}</b> bằng <b>${st.ans}</b>.`;
    case 'kiemtra': return `Kiểm tra lượt chia ${st.luot} là ĐÚNG vì <b>${st.r} &lt; ${st.d}</b> &nbsp;(số dư phải bé hơn số chia).`;
    case 'ha':   return `Hạ <b>${st.digit}</b>. <i>(Chỉ được hạ 1 chữ số và phải thẳng hàng)</i>`;
    case 'ketluan': return `Vậy <b>${st.N} : ${st.d} = ${st.q}</b> (dư <b>${st.r}</b>).`;
    case 'thulai':  return `Thử lại: <b>${st.q} × ${st.d} + ${st.r} = ${st.N}</b> &nbsp;(đúng).`;
  }
  return '';
}

function scene(ai, done, total){
  const n = Math.max(total,1);
  const W = 600, H = 96;
  let g='';
  for(let i=0;i<n;i++){
    const x = 48 + i*((W-96)/Math.max(n-1,1));
    g += `<g transform="translate(${x.toFixed(1)},74)">${glyphSVG(ai.glyph, i<done, ai.mau)}</g>`;
  }
  const pct = done/n;
  const sky = ai.id===1 ? ['#3E2A1C','#6B4423'] : ai.id===5 ? ['#2A1A2E','#6B2338'] : ['#17313F','#2E6B7A'];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="sk${ai.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#sk${ai.id})"/>
    <circle cx="${W-56}" cy="24" r="14" fill="#F5C84C" opacity=".85"/>
    <path d="M0 78 Q75 ${70+Math.sin(Date.now()/900)*3} 150 78 T300 78 T450 78 T600 78 V96 H0 Z" fill="rgba(255,255,255,.1)"/>
    ${g}
    <rect x="0" y="${H-7}" width="${(W*pct).toFixed(1)}" height="7" fill="${ai.mau}" opacity=".95"/>
  </svg>`;
}

/* ---------- bàn phím số ---------- */
function numpad(slots, onDone, opts){
  opts=opts||{};
  const requireOk = slots.some(s=>s.max>1) || opts.requireOk;
  let cur = 0;
  const vals = slots.map(()=> '');
  const multi = slots.length > 1;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="slots" id="sl"></div>
    <div class="pad" id="pd">
      ${[1,2,3,4,5].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      ${[6,7,8,9,0].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key fn" data-k="del" style="grid-column:span 2">⌫ Xoá</button>
      <button class="key fn" data-k="hint">🧙 Quân sư</button>
      <button class="key ok" data-k="ok" style="grid-column:span 2">✔ Trả lời</button>
      ${multi?`<button class="key fn" data-k="nx" style="grid-column:span 5">⏭ Sang ô “${esc(slots[1].label||'sau')}”</button>`:''}
    </div>`;
  if(!requireOk) wrap.querySelector('[data-k="ok"]').style.opacity='.55';
  if(!opts.hint) wrap.querySelector('[data-k="hint"]').style.visibility='hidden';

  function draw(){
    wrap.querySelector('#sl').innerHTML = slots.map((s,i)=>
      `<div class="slot ${i===cur?'on':''}" data-i="${i}">
        ${s.label?`<div class="lb">${s.label}</div>`:''}
        <div class="bx">${vals[i]===''?'<span style="opacity:.25">?</span>':esc(vals[i])}</div>
      </div>`).join('');
    wrap.querySelectorAll('.slot').forEach(el=>el.onclick=()=>{ cur=+el.getAttribute('data-i'); SFX.tap(); draw(); });
  }
  let pending = null;                  // lần tự-nộp đang chờ (để con kịp nhìn thấy chữ số)
  function cancelPending(){ if(pending){ clearTimeout(pending); pending=null; } }
  function submit(snap){
    cancelPending();
    const v = snap || vals;
    if(v.some(x=>x==='')) { SFX.bad(); return; }
    onDone(v.map(Number), wrap);
  }
  wrap.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-k');
    if(k==='hint'){ SFX.tap(); opts.hint&&opts.hint(); return; }
    if(k==='nx'){ cancelPending(); SFX.tap(); cur=Math.min(cur+1, slots.length-1); draw(); return; }
    if(k==='del'){ cancelPending(); SFX.tap(); if(vals[cur]!=='') vals[cur]=vals[cur].slice(0,-1); else if(cur>0){cur--;vals[cur]=vals[cur].slice(0,-1);} draw(); return; }
    if(k==='ok'){ SFX.tap(); submit(); return; }
    cancelPending();                       // con bấm tiếp thì huỷ lần nộp đang chờ
    SFX.tap();
    if(vals[cur].length >= slots[cur].max){ if(cur<slots.length-1){cur++; vals[cur]='';} else vals[cur]=''; }
    vals[cur] += k;
    const exact = vals.every((v,i)=>v.length===slots[i].max);
    if(vals[cur].length>=slots[cur].max && cur<slots.length-1) cur++;
    draw();
    if(!requireOk && exact){ const snap=vals.slice(); pending=setTimeout(()=>submit(snap),120); }
  });
  draw();
  return wrap;
}

   ẢI 1 / TRẠI: ƯỚC LƯỢNG THƯƠNG
   ============================================================ */
function cauUocLuong(){
  const q = deUocLuong();
  let lan = 0;
  khung(`<div class="card">
      <div class="chips"><div class="chip on">CHIA</div><div class="chip">ước lượng thương</div></div>
      <div class="ask" style="font-size:clamp(30px,10vw,52px);font-weight:800">
        <span class="n1">${q.N}</span> : <span class="n2">${q.d}</span> = <span class="n3">?</span> &nbsp;(dư <span class="n4">?</span>)
      </div>
      <div id="np"></div>
      <div class="legend"><i style="color:var(--xanh)">● số bị chia</i><i style="color:var(--cam)">● số chia</i>
      <i style="color:var(--la)">● thương</i><i style="color:var(--do)">● số dư</i></div>
      <div class="fb" id="fb"></div>
      <div class="bar" id="bar"></div>
    </div>`);
  noi(`${q.N} chia ${q.d} được mấy, dư mấy?`);
  const f=$('#fb'), bar=$('#bar');
  const pad = numpad(
    [{label:'Thương',max:1},{label:'Số dư',max:1}],
    ([tq,tr])=>{
      G.buocTong++;
      if(tq===q.q && tr===q.r){
        SFX.good(); G.buocDung += lan===0?1:0;
        const diem = (lan===0 && G.goiY===0)?10:5;
        addHao(diem); G.dung++;
        fb(f,'good','🎉 Chính xác!',
          `<b>${q.N} : ${q.d} = ${q.q}</b> (dư <b>${q.r}</b>) &nbsp;·&nbsp; Thử lại: ${q.q} × ${q.d} + ${q.r} = <b>${q.N}</b> ✔ &nbsp;<b>+${diem}</b> 🥁`);
        pad.querySelector('#pd').style.pointerEvents='none';
        bar.innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
        $('#nx').onclick=()=>{ G.i++; G.goiY=0; nin(); tiepCau(); };
      } else {
        SFX.bad(); lan++;
        let msg;
        if(tq > q.q){
          msg = `${tq} × ${q.d} = <b>${tq*q.d}</b>, mà số bị chia chỉ có <b>${q.N}</b>. ${tq*q.d>q.N?'Nhiều quá rồi!':''} Con thử chọn thương <b>nhỏ hơn</b> xem.`;
        } else if(tq < q.q){
          const du = q.N - tq*q.d;
          msg = `${tq} × ${q.d} = ${tq*q.d}, ${q.N} − ${tq*q.d} = <b>${du}</b>. Nhưng <b>${du} ≥ ${q.d}</b> → <b>số dư chưa bé hơn số chia</b>, nghĩa là còn chia được nữa! Chọn thương <b>lớn hơn</b> nhé.`;
        } else {
          msg = `Thương <b>${q.q}</b> đúng rồi! Nhưng số dư thì chưa. Tính lại: ${q.N} − (${q.q} × ${q.d}) = ${q.N} − ${q.q*q.d} = <b>?</b>`;
        }
        fb(f,'bad','🛡️ Chưa đúng, thử lại nào!', msg);
        bar.innerHTML=`<button class="btn ghost" id="hn">🧙 Xem bảng nhân ${q.d}</button>`;
        $('#hn').onclick=()=>{ G.goiY++; modal(bangNhan(q.d,q.N)); };
      }
    },
    { hint(){ G.goiY++; modal(bangNhan(q.d,q.N)); } }
  );
  $('#np').appendChild(pad);
}

  plan.rows.forEach((row,ri)=>{
    let cells='';
    for(let c=0;c<plan.nCols;c++){
      const cell=row.cells[c];
      const key='r'+ri+'c'+c;
      const vis = shown.has(key);
      const hl = focus && focus.row===ri && c>=focus.from && c<=focus.to;
      const tp = tapHa && ri===0 && tapHa.cols.indexOf(c)>=0;
      cells += `<div class="cell ${vis?'show':''} ${nw.has(key)?'pop':''} ${hl?'hl':''} ${tp?'tap':''}" ${tp?`data-ha="${c}"`:''}>
        ${cell?`<span class="v ${cell.cls}">${cell.v}</span>`:''}</div>`;
    }
    left += `<div style="display:grid;grid-template-columns:repeat(${plan.nCols},var(--cw))">${cells}</div>`;
    if(row.rule){
      const w=`calc(var(--cw) * ${row.rule.to-row.rule.from+1})`;
      const off=`calc(var(--cw) * ${row.rule.from})`;
      left += `<div class="rule ${shown.has('rule'+ri)?'show':''}" style="width:${w};margin-left:${off}"></div>`;
    }
  });
  const quot = plan.quot.map((q,i)=>
    `<div class="cell ${shown.has('q'+i)?'show':''} ${nw.has('q'+i)?'pop':''}"><span class="v ${q.cls}">${q.v}</span></div>`).join('');
  return `<div class="board" style="--cw:${cw};--ch:${ch}">
    <div class="dt">
      <div class="dtL">${left}</div>
      <div class="dtR">
        <div class="dtQ"><div class="cell show"><span class="v c-chia">${plan.d}</span></div></div>
        <div class="rl"></div>
        <div class="dtQ">${quot}</div>
      </div>
    </div></div>
   <div class="legend"><i style="color:var(--xanh)">● số bị chia</i><i style="color:var(--cam)">● số chia</i>
   <i style="color:var(--la)">● thương</i><i style="color:var(--do)">● số dư</i><i style="color:var(--tim)">● số hạ xuống</i></div>`;
}
function chipsHTML(kind){
  const ks=['chia','nhan','tru','ha'], lb={chia:'CHIA',nhan:'NHÂN',tru:'TRỪ',ha:'HẠ'};
  return `<div class="chips">${ks.map(k=>`<div class="chip ${k===kind?'on':''}">${lb[k]}</div>`).join('')}</div>`;
}
function revealKeys(st, plan){
  const out=[];
  (st.reveal||[]).forEach(r=>{
    if(r.quot!=null){ out.push('q'+r.quot); return; }
    if(r.col!=null){ out.push('r'+r.row+'c'+r.col); return; }
    if(r.cols){ r.cols.forEach(c=>out.push('r'+r.row+'c'+c)); if(r.rule) out.push('rule'+r.row); return; }
    for(let c=0;c<plan.nCols;c++) if(plan.rows[r.row].cells[c]) out.push('r'+r.row+'c'+c);
    if(plan.rows[r.row].rule) out.push('rule'+r.row);
  });
  return out;
}

function cauDatTinh(){
  const a=G.ai;
  const kieu = a.kieu==='MIX' ? pick(['A','B','C']) : a.kieu;
  const de = deTheoKieu(kieu);
  const plan = buildPlan(de.N, de.d);
  const gian = a.gian ? (a.gian[G.i] || 'medium') : (G.i<2?'full':'medium');
  chayDatTinh(plan, gian, ()=>{ G.i++; G.goiY=0; tiepCau(); });
}

/* lọc bước theo mức giàn giáo */
function locBuoc(steps, gian){
  return steps.map(s=>{
    const c=Object.assign({},s);
    if(gian==='medium' && (s.kind==='nhan'||s.kind==='kiemtra')) c.auto=true;
    if(gian==='fast' && ['chia','nhan','tru','ha','kiemtra','chon'].indexOf(s.kind)>=0) c.auto=true;
    return c;
  });
}

function chayDatTinh(plan, gian, onDone, demo){
  const a=G ? G.ai : AI[1];
  const steps = demo ? plan.steps.map(s=>Object.assign({},s)) : locBuoc(plan.steps, gian);
  const shown = new Set();
  for(let c=0;c<plan.nCols;c++) shown.add('r0c'+c);
  let idx = 0, lan = 0, hinted = false;

  let lastFocus=null, lastTap=null;
  function layout(bodyHTML, focus, tapHa, chip){
    lastFocus=focus; lastTap=tapHa;
    const tienDo = `${G?(G.trai?('Câu '+(G.i+1)):('Câu '+(G.i+1)+'/'+G.total)):'Bài mẫu'}`;
    app.innerHTML = topbar(demo?`📖 Bài mẫu: ${plan.N} : ${plan.d}`:`Ải ${a.id} · ${tienDo}`, true, G?haoChip():'') +
      (demo?'':`<div class="scene">${scene(a, Math.min(idx,steps.length), steps.length)}</div>`) +
      `<div class="card">
        ${chip!==false?chipsHTML(chip):''}
        <div id="boardWrap">${renderBoard(plan, shown, focus, tapHa)}</div>
        ${bodyHTML}
      </div>`;
    bindTop(()=>{ nin(); if(demo) manHinhGioiThieu(a); else if(G.trai) manHinhBanDo(); else manHinhGioiThieu(a); });
  }

  // hiện các ô mới + vẽ lại bảng ngay (có hiệu ứng nảy)
  function doReveal(st, repaint){
    const keys = revealKeys(st, plan);
    const fresh = new Set(keys.filter(k=>!shown.has(k)));
    keys.forEach(k=>shown.add(k));
    if(repaint!==false){
      const w = app.querySelector('#boardWrap');
      if(w) w.innerHTML = renderBoard(plan, shown, lastFocus, null, fresh);
    }
  }

  function next(){
    idx++; lan=0; hinted=false; render();
  }

  function render(){
    if(idx >= steps.length){ onDone(); return; }
    const st = steps[idx];

    /* ---- bước tự động (giàn giáo đã giảm) ---- */
    if(st.auto && !demo){
      doReveal(st,false);
      if(st.kind!=='kiemtra') SFX.tap();
      layout(`<div class="fb on info"><span class="hd">⚙️ Bước này cô làm giúp con</span>${loiGiang(st,plan)}</div>`,
             st.focus, null, st.kind);
      setTimeout(()=>{ idx++; render(); }, st.kind==='kiemtra'?900:620);
      return;
    }

    /* ---- chế độ xem mẫu ---- */
    if(demo){
      doReveal(st,false);
      const tiep = idx<steps.length-1;
      layout(`<div class="fb on info"><span class="hd">${nhanBuoc(st)}</span>${loiGiang(st,plan)}</div>
        <div class="bar">
          <button class="btn kim" id="nx">${tiep?'Tiếp theo ▶':'Xong ✔'}</button>
          ${idx>0?`<button class="btn ghost" id="pv">◀ Lùi lại</button>`:''}
        </div>`, st.focus, null, demoChip(st));
      noi(String(loiGiang(st,plan)).replace(/<[^>]+>/g,''));
      SFX.tap();
      $('#nx').onclick=()=>{ if(tiep){idx++;render();} else onDone(); };
      const pv=$('#pv'); if(pv) pv.onclick=()=>{ idx--; rebuildShown(); render(); };
      return;
    }

    /* ---- các bước tương tác ---- */
    const fbBox = `<div class="fb" id="fb"></div><div class="bar" id="bar"></div>`;

    if(st.kind==='chon'){
      const html = `<div class="ask">Chữ số đầu tiên của số bị chia là <b class="n1">${st.first}</b>, số chia là <b class="n2">${st.d}</b>.<br>Con lấy <u>mấy chữ số</u> để chia?</div>
        <div class="choices">
          <button class="ch" data-v="1">🔹 Lấy <b>1 chữ số</b> → chia <b>${st.first} : ${st.d}</b></button>
          <button class="ch" data-v="2">🔸 Lấy <b>2 chữ số</b> → chia <b>${st.twoVal} : ${st.d}</b></button>
        </div>${fbBox}`;
      layout(html, st.focus, null, 'chia');
      noi(`Chữ số đầu tiên là ${st.first}, số chia là ${st.d}. Con lấy mấy chữ số để chia?`);
      const f=$('#fb');
      app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
        const v=+b.getAttribute('data-v'); const dung = (v===2)===st.takeTwo;
        G.buocTong++;
        if(dung){
          SFX.good(); b.classList.add('ok'); if(lan===0) G.buocDung++;
          addHao(lan===0?10:5);
          doReveal(st);
          fb(f,'good','✅ Đúng rồi!', loiGiang(st,plan));
          app.querySelectorAll('.ch').forEach(x=>x.style.pointerEvents='none');
          $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
          $('#nx').onclick=next;
        }else{
          SFX.bad(); b.classList.add('no'); lan++;
          const msg = st.takeTwo
            ? `<b>${st.first} &lt; ${st.d}</b> — chữ số đầu bé hơn số chia nên lấy 1 chữ số thì <b>không chia được</b>. Phải lấy <b>2 chữ số</b>: ${st.twoVal}.`
            : `<b>${st.first} ${st.first===st.d?'=':'&gt;'} ${st.d}</b> — chữ số đầu đã lớn hơn hoặc bằng số chia rồi, nên chỉ cần lấy <b>1 chữ số</b> thôi.`;
          fb(f,'bad','🛡️ Chưa đúng!', msg + '<br><br>📌 Nhớ nhé: <b>đầu ≥ chia → lấy 1 chữ số · đầu &lt; chia → lấy 2 chữ số</b>');
        }
      });
      return;
    }

    if(st.kind==='kiemtra'){
      doReveal(st,false);
      layout(`<div class="fb on good"><span class="hd">🔍 Kiểm tra lượt chia ${st.luot}</span>
        Số dư là <b>${st.r}</b>, số chia là <b>${st.d}</b>. &nbsp;<b style="font-size:21px">${st.r} &lt; ${st.d}</b> ✔<br>
        <i>Số dư luôn phải bé hơn số chia — đây là cách con tự biết mình làm đúng.</i></div>
        <div class="bar"><button class="btn kim" id="nx">Tiếp ▶</button></div>`, null, null, 'tru');
      SFX.chieng();
      $('#nx').onclick=next;
      return;
    }

    if(st.kind==='ha'){
      const allCols = Array.from({length:plan.nCols},(_,i)=>i);
      layout(`<div class="ask">Lượt chia ${st.luot} xong rồi. Bây giờ <b>HẠ</b> chữ số nào xuống?<br>
        <span style="font-size:15px;opacity:.75">👉 Bấm vào một chữ số của <b style="color:var(--xanh)">số bị chia</b> ở hàng trên cùng</span></div>${fbBox}`,
        null, {cols:allCols}, 'ha');
      noi('Bây giờ hạ chữ số nào xuống?');
      const f=$('#fb');
      // cho bấm vào mọi chữ số của số bị chia để bắt đúng lỗi của con
      app.querySelectorAll('.dtL > div:first-child .cell').forEach((el,c)=>{
        el.onclick=()=>{
          G.buocTong++;
          if(c===st.col){
            SFX.good(); if(lan===0) G.buocDung++; addHao(lan===0?10:5);
            const nx = steps[idx+1];
            doReveal(st);
            fb(f,'good','✅ Hạ đúng!', loiGiang(st,plan)+(nx&&nx.cur!=null?`<br>Bây giờ phần phải chia là <b>${nx.cur}</b>.`:''));
            $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
            $('#nx').onclick=next;
          }else{
            SFX.bad(); lan++;
            fb(f,'bad','🛡️ Chưa đúng!',
              c<st.col ? `Chữ số <b>${plan.rows[0].cells[c].v}</b> mình <b>đã dùng rồi</b> ở lượt chia trước. Hạ chữ số <b>tiếp theo</b> cơ.`
                       : `Phải hạ <b>lần lượt từng chữ số</b> từ trái sang phải, không được nhảy cóc.`);
          }
        };
      });
      return;
    }

    if(st.kind==='ketluan'){
      layout(`<div class="ask">Viết kết quả nào! &nbsp; <b class="n1">${st.N}</b> : <b class="n2">${st.d}</b> = ?</div>
        <div id="np"></div>${fbBox}`, null, null, 'ha');
      noi(`${st.N} chia ${st.d} bằng bao nhiêu, dư bao nhiêu?`);
      const f=$('#fb');
      const pad = numpad([{label:'Thương',max:2},{label:'Số dư',max:1}], ([tq,tr])=>{
        G.buocTong++;
        if(tq===st.q && tr===st.r){
          SFX.good(); if(lan===0) G.buocDung++; addHao(lan===0?10:5);
          fb(f,'good','🎉 Chính xác!', loiGiang(st,plan));
          pad.querySelector('#pd').style.pointerEvents='none';
          $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
          $('#nx').onclick=next;
        }else{
          SFX.bad(); lan++;
          let m;
          if(tq!==st.q && String(st.q).length===2 && String(st.q)[1]==='0' && tq===+String(st.q)[0]){
            m = `Con <b>quên số 0</b> rồi! Thương có <b>2 chữ số</b>: lượt 1 được ${String(st.q)[0]}, lượt 2 được <b>0</b> → thương là <b>${st.q}</b>.<br>Thử lại mà xem: ${tq} × ${st.d} + ${tr} = ${tq*st.d+tr}, khác ${st.N} → sai!`;
          } else if(tq!==st.q){
            m = `Thương chưa đúng. Con nhìn lại các chữ số <b style="color:var(--la)">màu xanh lá</b> bên phải bảng — ghép lại theo thứ tự sẽ ra thương.`;
          } else {
            m = `Thương đúng rồi! Số dư là con số <b style="color:var(--do)">màu đỏ cuối cùng</b> ở dưới bảng nhé.`;
          }
          fb(f,'bad','🛡️ Xem lại bảng chia nào!', m);
        }
      }, { requireOk:true, hint(){ G.goiY++; modal(`<h3>🧙 Quân sư</h3>
        <p>Thương chính là các chữ số <b style="color:#2E9E5B">màu xanh lá</b> ở bên phải, ghép lại từ trên xuống.</p>
        <p>Số dư là số <b style="color:#D62828">màu đỏ</b> ở <b>dòng cuối cùng</b> bên trái.</p>
        <p>Nhớ: <b>số dư luôn bé hơn số chia (${st.d})</b>.</p>`); } });
      $('#np').appendChild(pad);
      return;
    }

    if(st.kind==='thulai'){
      layout(`<div class="ask">🔐 Thử lại cho chắc!<br>
        <span style="font-size:clamp(22px,6vw,32px)"><b class="n3">${st.q}</b> × <b class="n2">${st.d}</b> + <b class="n4">${st.r}</b> = ?</span></div>
        <div id="np"></div>${fbBox}`, null, null, 'ha');
      noi(`Thử lại: ${st.q} nhân ${st.d} cộng ${st.r} bằng bao nhiêu?`);
      const f=$('#fb');
      const pad = numpad([{label:'Kết quả',max:3}], ([v])=>{
        G.buocTong++;
        if(v===st.N){
          SFX.win(); if(lan===0) G.buocDung++; addHao(lan===0?10:5); confetti();
          fb(f,'good','🏆 Tuyệt vời! Phép chia hoàn toàn chính xác!',
            `${st.q} × ${st.d} + ${st.r} = <b>${st.N}</b> — đúng bằng số bị chia ✔<br>
             <i>Mẹo: lần sau làm xong con cứ thử lại như vậy là biết ngay mình đúng hay sai.</i>`);
          pad.querySelector('#pd').style.pointerEvents='none';
          $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
          $('#nx').onclick=next;
        }else{
          SFX.bad(); lan++;
          fb(f,'bad','🛡️ Tính lại nhé!',
            `Làm <b>nhân trước, cộng sau</b>: &nbsp;${st.q} × ${st.d} = <b>${st.q*st.d}</b>, rồi ${st.q*st.d} + ${st.r} = ?`);
        }
      }, { requireOk:true, hint(){ G.goiY++; modal(bangNhan(st.d, null)); } });
      $('#np').appendChild(pad);
      return;
    }

    /* chia / nhan / tru : nhập 1 số */
    const hoi = st.kind==='chia' ? `Lượt chia ${st.luot}: &nbsp;<b class="n1">${st.cur}</b> chia <b class="n2">${st.d}</b> được mấy?`
              : st.kind==='nhan' ? `<b class="n3">${st.q}</b> nhân <b class="n2">${st.d}</b> bằng mấy?`
              : `<b class="n1">${st.cur}</b> trừ <b>${st.p}</b> bằng mấy?`;
    const maxlen = String(st.ans).length;
    layout(`<div class="ask">${hoi}</div><div id="np"></div>${fbBox}`, st.focus, null, st.kind);
    noi(String(hoi).replace(/<[^>]+>/g,''));
    const f=$('#fb');
    const pad = numpad([{label:'',max:maxlen}], ([v])=>{
      G.buocTong++;
      if(v===st.ans){
        SFX.good(); if(lan===0 && !hinted) G.buocDung++;
        addHao((lan===0 && !hinted)?10:5);
        doReveal(st);
        const extra = st.kind==='chia' && st.q===0
          ? `<br>⭐ Đây là <b>trường hợp đặc biệt</b>: từ lượt chia thứ 2, nếu phần đang chia bé hơn số chia thì <b>thương bằng 0</b> — <b>không được bỏ qua</b>!` : '';
        fb(f,'good','✅ Giỏi lắm!', loiGiang(st,plan)+extra);
        pad.querySelector('#pd').style.pointerEvents='none';
        $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
        $('#nx').onclick=next;
      }else{
        SFX.bad(); lan++;
        let m='';
        if(st.kind==='chia'){
          if(v>st.ans){
            m = `${v} × ${st.d} = <b>${v*st.d}</b>, mà con chỉ có <b>${st.cur}</b>. <b>${v*st.d} &gt; ${st.cur}</b> → nhiều quá rồi!<br>👉 Chọn số <b>bé hơn</b>.`;
          }else{
            const du = st.cur - v*st.d;
            m = `${v} × ${st.d} = ${v*st.d}, &nbsp;${st.cur} − ${v*st.d} = <b>${du}</b>.<br>
                 Nhưng <b>${du} ≥ ${st.d}</b> → <b>số dư chưa bé hơn số chia</b>, nghĩa là <b>còn chia được nữa</b>!<br>👉 Chọn số <b>lớn hơn</b>.`;
          }
          m += `<br><br>💡 Mẹo: tìm số lớn nhất mà nhân với ${st.d} <b>không vượt quá ${st.cur}</b>.`;
        } else if(st.kind==='nhan'){
          m = `Con đọc lại bảng nhân ${st.d} nhé: ${[1,2,3,4,5].map(i=>`${st.d}×${i}=${st.d*i}`).join(' · ')} …<br>👉 Cần tính <b>${st.q} × ${st.d}</b>.`;
        } else {
          m = `Lấy <b>${st.cur}</b> bớt đi <b>${st.p}</b>. Con có thể đếm lùi từ ${st.cur}: ${Array.from({length:Math.min(st.p,6)},(_,i)=>st.cur-i-1).join(', ')}${st.p>6?'…':''}`;
        }
        fb(f,'bad','🛡️ Chưa đúng, nhưng không sao!', m);
      }
    }, { hint(){
        hinted=true; G.goiY++;
        if(st.kind==='chia') modal(bangNhan(st.d, st.cur));
        else if(st.kind==='nhan') modal(bangNhan(st.d, null));
        else modal(`<h3>🧙 Quân sư</h3><p>Con cần tính <b>${st.cur} − ${st.p}</b>.</p>
          <p>Cách dễ: đếm lùi từ <b>${st.cur}</b> lùi <b>${st.p}</b> bước.</p>
          <p>Hoặc nhớ: phép trừ này chính là <b>phần còn lại</b> sau khi lấy đi ${st.q} nhóm ${st.d}.</p>`);
      } });
    $('#np').appendChild(pad);
  }

  function rebuildShown(){
    shown.clear();
    for(let c=0;c<plan.nCols;c++) shown.add('r0c'+c);
    for(let i=0;i<idx;i++) revealKeys(steps[i],plan).forEach(k=>shown.add(k));
  }
  function nhanBuoc(st){
    return { chon:'1️⃣ Xem lấy mấy chữ số', chia:'➗ Bước CHIA', nhan:'✖️ Bước NHÂN',
             tru:'➖ Bước TRỪ', ha:'⬇️ Bước HẠ', kiemtra:'🔍 Kiểm tra',
             ketluan:'🏁 Kết luận', thulai:'🔐 Thử lại' }[st.kind] || '';
  }
  function demoChip(st){
    return ['chia','nhan','tru','ha'].indexOf(st.kind)>=0 ? st.kind : (st.kind==='chon'?'chia':'ha');
  }

  render();
}

/* ---------- xem mẫu ---------- */
function choiDemo(a, k){
  const list=a.mau_demo;
  if(k>=list.length){ manHinhGioiThieu(a); return; }
  const [N,d]=list[k];
  const plan=buildPlan(N,d);
  G = G || {ai:a,i:0,total:1,trai:false,dung:0,buocTong:0,buocDung:0,goiY:0};
  const save_=G; G={ai:a,i:0,total:1,trai:false,dung:0,buocTong:0,buocDung:0,goiY:0};
  chayDatTinh(plan,'full',()=>{
    G=save_;
    SFX.chieng();
    const con = k+1<list.length;
    app.innerHTML = topbar('📖 Bài mẫu', true, '') + `<div class="card" style="text-align:center">
      <h2 style="color:var(--son)">✅ Xong bài mẫu ${N} : ${d} = ${Math.floor(N/d)} (dư ${N%d})</h2>
      <p style="font-size:16px">Con đã xem cô làm mẫu đủ 4 bước <b>CHIA – NHÂN – TRỪ – HẠ</b>.</p>
      <div class="bar">
        ${con?`<button class="btn kim" id="nx">📖 Xem bài mẫu tiếp theo</button>`:''}
        <button class="btn" id="go">⚔️ Giờ con tự làm!</button>
        <button class="btn ghost" id="again">🔁 Xem lại bài này</button>
      </div></div>`;
    bindTop(()=>manHinhGioiThieu(a));
    if(con) $('#nx').onclick=()=>choiDemo(a,k+1);
    $('#go').onclick=()=>{ SFX.trong(); batDau(a); };
    $('#again').onclick=()=>choiDemo(a,k);
  }, true);
}

/* ============================================================
   ẢI 5: HÀNH QUÂN THẦN TỐC  (lời văn + đặt tính nhanh)
   ============================================================ */
function cauThanToc(){
  const loai = G.i%2===0 ? 'lv' : 'nhanh';
  if(loai==='lv') cauLoiVan(); else cauNhanh();
}

function cauLoiVan(){
  const {tpl,a,b,q,r} = deLoiVan();
  const dap = tpl.mode==='du' ? [q,r] : tpl.mode==='len' ? [q+1] : [q];
  let lan=0;
  const slots = tpl.mode==='du'
    ? [{label:tpl.u1,max:2},{label:tpl.u2,max:1}]
    : [{label:tpl.u1,max:2}];
  khung(`<div class="card">
    <div class="chips"><div class="chip on">TOÁN CÓ LỜI VĂN</div></div>
    <div class="ask" style="text-align:left;font-size:18px;background:rgba(0,0,0,.05);padding:14px;border-radius:14px">
      📜 ${tpl.t(a,b)}<br><b style="color:var(--son)">${tpl.h}</b></div>
    <div style="text-align:center;font-size:clamp(22px,6vw,30px);font-weight:800;margin:12px 0 4px">
      Phép tính: <span class="n1" style="color:var(--xanh)">${a}</span> : <span class="n2" style="color:var(--cam)">${b}</span></div>
    <div id="np"></div>
    <div class="fb" id="fb"></div><div class="bar" id="bar"></div></div>`);
  noi(String(tpl.t(a,b)).replace(/<[^>]+>/g,'') + ' ' + tpl.h);
  const f=$('#fb');
  const pad=numpad(slots, vals=>{
    G.buocTong++;
    const ok = vals.length===dap.length && vals.every((v,i)=>v===dap[i]);
    if(ok){
      SFX.good(); if(lan===0) G.buocDung++; addHao(lan===0?10:5); G.dung++;
      let giai = `Phép chia: <b>${a} : ${b} = ${q} (dư ${r})</b>.<br>`;
      if(tpl.mode==='du')   giai += `Mỗi phần được <b>${q}</b>, còn thừa <b>${r}</b>. ✔`;
      if(tpl.mode==='len')  giai += `${q} chuyến chở được ${q*b}, vẫn còn <b>${r}</b> chưa đi → phải thêm <b>1 chuyến nữa</b> → <b>${q+1}</b>.<br>⭐ Hỏi “<b>cần ít nhất</b>” thì <b>CỘNG THÊM 1</b> khi còn dư.`;
      if(tpl.mode==='xuong')giai += `Chỉ <b>${q}</b> phần là ĐẦY, phần dư ${r} <b>chưa đủ</b> nên không tính.<br>⭐ Hỏi “<b>đầy / nhiều nhất</b>” thì <b>BỎ phần dư</b>.`;
      fb(f,'good','🎉 Giỏi quá!', giai + ` &nbsp;<b>+${lan===0?10:5}</b> 🥁`);
      pad.querySelector('#pd').style.pointerEvents='none';
      $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
      $('#nx').onclick=()=>{ G.i++; nin(); tiepCau(); };
    }else{
      SFX.bad(); lan++;
      let m=`Trước hết tính <b>${a} : ${b}</b> xem được mấy, dư mấy đã nhé.`;
      if(lan>=2){
        m = `Gợi ý: <b>${a} : ${b} = ${q} (dư ${r})</b>.<br>`;
        if(tpl.mode==='du')   m += `Câu hỏi hỏi <b>mỗi phần mấy</b> và <b>thừa mấy</b> → trả lời <b>${q}</b> và <b>${r}</b>.`;
        if(tpl.mode==='len')  m += `Câu hỏi là “<b>cần ít nhất</b>”. Còn dư ${r} vẫn phải chở → <b>phải thêm 1 chuyến</b>!`;
        if(tpl.mode==='xuong')m += `Câu hỏi là “<b>đầy / nhiều nhất</b>”. Phần dư ${r} chưa đủ một phần → <b>không tính</b>.`;
      }
      fb(f,'bad','🛡️ Đọc kỹ câu hỏi nhé!', m);
    }
  },{ requireOk:true, hint(){ G.goiY++; modal(`<h3>🧙 Quân sư</h3>
    <p>Bước 1: luôn làm <b>phép chia</b> trước → ${a} : ${b}</p>
    <p>Bước 2: <b>đọc kỹ câu hỏi</b>:</p>
    <ul>
      <li>“mỗi … mấy, thừa mấy” → trả lời <b>thương</b> và <b>số dư</b></li>
      <li>“<b>cần ít nhất</b> mấy …” → còn dư thì <b>+ 1</b></li>
      <li>“<b>đầy / nhiều nhất</b> mấy …” → <b>bỏ số dư</b></li>
    </ul>`); } });
  $('#np').appendChild(pad);
}

function cauNhanh(){
  const kieu = pick(['A','B','C']);
  const de = deTheoKieu(kieu);
  const q = Math.floor(de.N/de.d), r = de.N%de.d;
  let lan=0, left = 20, timer=null;
  khung(`<div class="card">
    <div class="chips"><div class="chip on">THẦN TỐC</div></div>
    <div class="timer" id="tm">⏱ <div class="tbar"><i id="tb" style="width:100%"></i></div>
      <button class="btn ghost sm" id="off" style="padding:6px 12px;min-height:34px">Tắt đồng hồ</button></div>
    <div class="ask" style="font-size:clamp(30px,10vw,52px);font-weight:800">
      <span class="n1">${de.N}</span> : <span class="n2">${de.d}</span> = <span class="n3">?</span> (dư <span class="n4">?</span>)</div>
    <div id="np"></div>
    <div class="fb" id="fb"></div><div class="bar" id="bar"></div></div>`);
  noi(`${de.N} chia ${de.d}`);
  const f=$('#fb'), tb=$('#tb');
  function stop(){ if(timer){ clearInterval(timer); timer=null; } }
  if(G.tatDongHo){ $('#tm').style.display='none'; }
  else {
    timer=setInterval(()=>{
      if(!tb || !document.body.contains(tb)){ stop(); return; }   // đã rời màn hình
      left-=0.25; tb.style.width=Math.max(0,left/20*100)+'%';
      if(left<=0){ stop(); const tm=$('#tm'); if(tm) tm.style.opacity='.4'; }
    },250);
  }
  $('#off').onclick=()=>{ G.tatDongHo=true; stop(); $('#tm').style.display='none'; SFX.tap(); };
  const pad=numpad([{label:'Thương',max:2},{label:'Số dư',max:1}], ([tq,tr])=>{
    G.buocTong++;
    if(tq===q && tr===r){
      stop(); SFX.good(); if(lan===0) G.buocDung++;
      const bonus = (!G.tatDongHo && left>0 && lan===0) ? 5 : 0;
      addHao((lan===0?10:5)+bonus); G.dung++;
      fb(f,'good','⚡ Thần tốc!', `<b>${de.N} : ${de.d} = ${q} (dư ${r})</b> · Thử lại: ${q} × ${de.d} + ${r} = <b>${de.N}</b> ✔
        &nbsp;<b>+${(lan===0?10:5)+bonus}</b> 🥁${bonus?' (có thưởng tốc độ!)':''}`);
      pad.querySelector('#pd').style.pointerEvents='none';
      $('#bar').innerHTML=`<button class="btn kim" id="nx">Tiếp ▶</button>`;
      $('#nx').onclick=()=>{ G.i++; nin(); tiepCau(); };
    }else{
      SFX.bad(); lan++;
      let m;
      if(tq!==q){
        const first=String(de.N)[0];
        m = first<de.d
          ? `Chữ số đầu <b>${first} &lt; ${de.d}</b> → phải lấy <b>cả 2 chữ số</b> (${de.N}) để chia, nên thương chỉ có <b>1 chữ số</b>.`
          : `Chữ số đầu <b>${first} ≥ ${de.d}</b> → lấy <b>1 chữ số</b> trước, nên thương có <b>2 chữ số</b>.`;
        if(String(q).length===2 && String(q)[1]==='0') m += `<br>⭐ Chú ý: lượt chia 2 có thể ra <b>0</b> — đừng quên viết số 0!`;
      } else {
        m = `Thương đúng rồi! Số dư = ${de.N} − (${q} × ${de.d}) = ${de.N} − ${q*de.d} = <b>?</b>`;
      }
      fb(f,'bad','🛡️ Thử lại!', m);
      $('#bar').innerHTML=`<button class="btn ghost" id="hn">🧙 Bảng nhân ${de.d}</button>
        <button class="btn ghost" id="dt">✏️ Đặt tính từng bước</button>`;
      $('#hn').onclick=()=>{ G.goiY++; modal(bangNhan(de.d,de.N)); };
      $('#dt').onclick=()=>{ stop(); G.goiY++; chayDatTinh(buildPlan(de.N,de.d),'full',()=>{ G.i++; tiepCau(); }); };
    }
  },{ requireOk:true, hint(){ G.goiY++; modal(bangNhan(de.d,de.N)); } });
  $('#np').appendChild(pad);
}

/* ============================================================
   KẾT QUẢ
   ============================================================ */
function ketQua(){
  nin();
  const a=G.ai;
  const tl = G.buocTong ? G.buocDung/G.buocTong : 0;
  const sao = tl>=0.9 ? 3 : tl>=0.7 ? 2 : tl>=0.45 ? 1 : 0;
  const cu = P.stars[a.id]||0;
  if(sao>cu){ P.stars[a.id]=sao; save(); }
  if(sao>=2){ SFX.win(); confetti(); } else SFX.chieng();

  const loi = {
    3:['🏆 ĐẠI THẮNG!','Con làm chủ hoàn toàn phép chia này rồi! Tướng quân giỏi lắm!'],
    2:['🎖️ THẮNG TRẬN!','Rất tốt! Chỉ còn vài chỗ nhỏ thôi, chơi lại là 3 sao ngay.'],
    1:['🛡️ GIỮ ĐƯỢC ẢI!','Con đã vượt qua. Chơi lại một lần nữa cho thật chắc nhé!'],
    0:['💪 CHƯA QUA, NHƯNG KHÔNG SAO!','Ai cũng phải tập nhiều lần. Con bấm "Xem mẫu" rồi làm lại là được ngay!']
  }[sao];

  app.innerHTML = topbar('Kết quả', true, haoChip()) + `
  <div class="card" style="text-align:center">
    <div class="stars">${'⭐'.repeat(sao)}${'☆'.repeat(3-sao)}</div>
    <h2 style="color:var(--son);margin:2px 0 4px">${loi[0]}</h2>
    <p style="font-size:16px;font-weight:700">${loi[1]}</p>
    <div class="statg">
      <div class="stat"><b>${Math.round(tl*100)}%</b><span>Đúng ngay lần đầu</span></div>
      <div class="stat"><b>${G.buocTong}</b><span>Bước đã làm</span></div>
      <div class="stat"><b>${G.goiY}</b><span>Lần hỏi quân sư</span></div>
      <div class="stat"><b>${P.hao}</b><span>Tổng hào khí 🥁</span></div>
    </div>
    <div style="background:#FFF3D0;padding:13px;border-radius:14px;text-align:left">
      <b style="color:var(--son-d)">📌 Ghi nhớ của ải này</b>
      <p style="margin:6px 0 0">${a.kn}</p>
      ${G.goiY>3?`<p style="margin:8px 0 0">💡 Con hỏi quân sư <b>${G.goiY} lần</b> — dấu hiệu là <b>bảng nhân còn chưa thuộc</b>. Vào <b>Trại rèn binh — Ước lượng thương</b> luyện 5 phút mỗi ngày là nhanh lắm!</p>`:''}
      ${tl<0.7?`<p style="margin:8px 0 0">💡 Con nên bấm <b>📖 XEM MẪU</b> một lượt rồi chơi lại ải này.</p>`:''}
    </div>
    <div class="bar">
      <button class="btn" id="again">🔁 Chơi lại ải này</button>
      ${a.id<5?`<button class="btn kim" id="next">▶ Ải tiếp theo</button>`:''}
      <button class="btn ghost" id="map">🗺️ Bản đồ</button>
    </div>
  </div>`;
  $('#again').onclick=()=>{ SFX.trong(); batDau(a); };
  $('#map').onclick=()=>{ SFX.tap(); manHinhBanDo(); };
  const nb=$('#next'); if(nb) nb.onclick=()=>{ SFX.trong(); manHinhGioiThieu(AI[a.id]); };
  bindTop(manHinhBanDo);
}

/* ---------- khởi động ---------- */
try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){}
manHinhChu();
</script>
